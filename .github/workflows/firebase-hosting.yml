
name: Deploy RentalCamera to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build RentalCamera
        run: npm run build

      - name: Deploy to Firebase Hosting (Live)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JMRENTALCAMERA }}
          channelId: live
          projectId: jmrentalcamera

      - name: Deploy Firebase Hosting Preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JMRENTALCAMERA }}
          channelId: pr-${{ github.event.number }}
          projectId: jmrentalcamera
          
<!-- This workflow builds the RentalCamera application and deploys it to Firebase Hosting when changes are pushed to the main branch. For pull requests targeting the main branch, it creates a preview deployment. -->